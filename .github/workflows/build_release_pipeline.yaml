name: Build and release ruby gem

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-release-pipeline:
    runs-on: ubuntu-latest
    container: ruby:3.4.10
    steps:
      - uses: actions/checkout@v7
      - name: Setup
        run: |
          apt-get update -y && apt-get install -y --no-install-recommends cmake
          gem install bundler
          bundle install

      - name: Build
        id: build
        run: |
          bundle exec rake build
          echo "gem_version=$(bundle exec rake version)" >> "$GITHUB_OUTPUT"

      - name: Release
        if: github.ref == 'refs/heads/master'
        run: gem push pkg/*.gem
        env:
          GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_AUTH_TOKEN }}

      - name: Tag repo with new gem version
        if: github.ref == 'refs/heads/master'
        uses: actions/github-script@v9
        env:
          TAG: v${{ steps.build.outputs.gem_version }}
        with:
          script: |
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/tags/${process.env.TAG}`,
              sha: context.sha
            })
